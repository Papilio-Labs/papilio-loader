name: Deploy web build to papilioworks.com

# Builds apps/web (esbuild bundles of board-recovery/ and loader/), mirrors
# the latest FPGA-Companion ESP32 release binary server-side (browsers can't
# fetch GitHub release assets directly — no CORS headers on them), and syncs
# the output into the Papilio-Works/papilioworks.com repo's board-recovery/,
# getting-started/ redirect, and loader/ directories. That repo auto-deploys to the live site (HostGator
# via rsync) on every push to its own main branch, so this workflow's push is
# what actually goes live.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/flasher-core/**"
      - "packages/loader-ui/**"
      - "scripts/fetch-latest-firmware.mjs"
      - ".github/workflows/deploy-web.yml"
  schedule:
    # Catches new FPGA-Companion releases even when nothing in this repo
    # changes — keeps the bundled ESP32 firmware on the Board Recovery page
    # current without anyone remembering to trigger a rebuild.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout papilio-loader-mcp
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build flasher-core
        run: npm run build --workspace=packages/flasher-core

      - name: Build apps/web
        run: npm run build --workspace=apps/web

      - name: Fetch latest ESP32 firmware
        run: node scripts/fetch-latest-firmware.mjs

      - name: Checkout papilioworks.com
        uses: actions/checkout@v4
        with:
          repository: Papilio-Works/papilioworks.com
          token: ${{ secrets.PAPILIOWORKS_DEPLOY_TOKEN }}
          path: papilioworks.com

      - name: Sync board-recovery/, legacy redirect, and loader/ into papilioworks.com
        run: |
          set -euo pipefail
          rm -rf papilioworks.com/flash
          rsync -a --delete apps/web/board-recovery/ papilioworks.com/board-recovery/
          rsync -a --delete apps/web/getting-started/ papilioworks.com/getting-started/
          rsync -a --delete apps/web/loader/ papilioworks.com/loader/
          rsync -a apps/web/css/ papilioworks.com/css/

      - name: Commit and push if changed
        working-directory: papilioworks.com
        run: |
          set -euo pipefail
          git config user.name "papilio-loader-mcp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- getting-started board-recovery loader css
          if git diff --cached --quiet; then
            echo "No changes to board-recovery/, getting-started/, loader/, or css/ — nothing to sync."
            exit 0
          fi
          git commit -m "board-recovery+loader: sync web build from papilio-loader-mcp@${GITHUB_SHA::7}"
          git push
